<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist | StyleNest</title>
<meta name="description" content="StyleNest - fashion for men, women and kids. A practice shop with made-up brands and products.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e11d48'/><text x='50' y='68' font-size='58' font-weight='800' text-anchor='middle' fill='white' font-family='Arial'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main><div class="container"><div class="page-h" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h1>My Wishlist <span class="hint" id="w-count"></span></h1><button class="btn ghost sm" id="clear-wish" type="button">CLEAR WISHLIST</button></div>
<div id="w-empty" class="empty" hidden><div style="font-size:48px">♡</div><h2 style="margin:8px 0">Your wishlist is empty</h2><p style="margin-bottom:16px">Tap the heart on any product to save it here.</p><a class="btn" id="w-shop" href="category.html?c=all">DISCOVER STYLES</a></div>
<div class="grid g4" id="w-grid"></div></div></main>
<script>
document.addEventListener('sn:ready',()=>{
const {$,$$,sleep,byId,pcard,Wish,skeletons}=SN;
function draw(){const ids=Wish.all(),l=ids.map(byId).filter(Boolean);$('#w-grid').innerHTML=l.map(pcard).join('');$('#w-empty').hidden=l.length>0;$('#clear-wish').hidden=!l.length;$('#w-count').textContent=l.length?'('+l.length+' items)':''}
$('#w-grid').innerHTML=skeletons(4);sleep(800).then(draw);
document.addEventListener('click',e=>{if(e.target.closest('[data-wish]')&&$('#w-grid').children.length)setTimeout(draw,50)});
$('#clear-wish').addEventListener('click',()=>{if(window.confirm('Remove all items from your wishlist?')){SN.store.set('wish',[]);SN.renderCounts();draw()}});
document.addEventListener('sn:storage',draw);
});
</script>
<script src="app.js"></script>
</body>
</html>
